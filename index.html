<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casino Club Online</title>
<style>
:root{--bg:#f3efe6;--card:#fff;--ink:#1c1b19;--mut:#6b675e;--gold:#9a6b00;--btn:#1c1b19;--btnink:#fff;--line:#d9d3c4;--ok:#1f8f4e;--no:#b3342a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211c;--ink:#f2efe7;--mut:#a9a699;--gold:#f0c24b;--btn:#f0c24b;--btnink:#1a1400;--line:#2b3a31}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211c;--ink:#f2efe7;--mut:#a9a699;--gold:#f0c24b;--btn:#f0c24b;--btnink:#1a1400;--line:#2b3a31}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:600px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}h1{font-size:19px;margin:0}h2{font-size:16px;margin:16px 0 6px}
button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--btn);color:var(--btnink);font-weight:600}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}button:disabled{opacity:.4}
input,select{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.mut{color:var(--mut);font-size:14px}.gold{color:var(--gold);font-weight:700}
.code{font:800 44px ui-monospace,Menlo,monospace;letter-spacing:6px;text-align:center;color:var(--gold)}
.opt{display:block;width:100%;margin:6px 0;text-align:left}.opt.sel{outline:3px solid var(--gold)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pad{height:90px;border-radius:16px;opacity:.45}.pad.lit{opacity:1;outline:5px solid #fff}
.big{display:block;width:230px;height:230px;border-radius:50%;margin:10px auto;font-size:30px;color:#fff}
table{width:100%;border-collapse:collapse}td{padding:5px 3px;border-bottom:1px solid var(--line)}.me{color:var(--gold);font-weight:700}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
#toast{position:static;min-height:22px;text-align:center;font-weight:600}
</style></head><body><div id="app"></div>
<script>
const COL=["#d94b3d","#3d7bd9","#35a85a","#e0b82c"],CN=["Rood","Blauw","Groen","Geel"],$=s=>document.querySelector(s);
let ws,logged=false,me={},room=null,off=0,name=localStorage.getItem("cc_name")||"",tok="",err="",toastT="",L={},wantCode=new URLSearchParams(location.search).get("room");
const tk=()=>"cc_token_"+name.toLowerCase();
function send(o){if(ws&&ws.readyState==1)ws.send(JSON.stringify(o))}
function conn(){tok=localStorage.getItem(tk())||"";ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host);
ws.onopen=()=>send({t:"hello",name,token:tok});
ws.onmessage=e=>on(JSON.parse(e.data));
ws.onclose=()=>{if(logged)setTimeout(conn,2500)}}
function on(m){if(m.t=="welcome"){logged=true;err="";me=m.me;if(m.token)localStorage.setItem(tk(),m.token);localStorage.setItem("cc_name",name);if(wantCode){send({t:"room.join",code:wantCode});wantCode=null}send({t:"room.list"})}
else if(m.t=="rooms"){Pub=m.list;const e=$("#pl");if(e)e.innerHTML=plist();return}else if(m.t=="me")me=m.me;else if(m.t=="cz.res"||m.t=="cz.bj"||m.t=="cz.rl"){me.chips=m.chips;if(m.t=="cz.res")Z.res=m;else if(m.t=="cz.bj")Z.bj=m;else{Z.rl=m;off=m.now-Date.now()}}else if(m.t=="room"){room=m.room;if(room)off=room.now-Date.now()}
else if(m.t=="toast"){toastT=m.text+(m.item?" 🎁":"");setTimeout(()=>{toastT="";const t=$("#toast");if(t)t.textContent=""},5000)}
else if(m.t=="error"){if(m.fatal){logged=false;err=m.text;ws.close()}else{toastT="⚠️ "+m.text;setTimeout(()=>{toastT="";const t=$("#toast");if(t)t.textContent=""},4000)}}
render()}
function login(){name=$("#nm").value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){err="Naam: 3-16 tekens (letters, cijfers, _).";return render()}err="Verbinden…";render();conn()}
function render(){const a=$("#app");if(!logged){a.innerHTML=`<h1>🎰 Casino Club Online</h1>${wantCode?`<p class="card">Je bent uitgenodigd voor kamer <b class="gold">${wantCode}</b>. Kies een naam om mee te doen.</p>`:""}<div class="card"><div class="row"><input id="nm" placeholder="Spelersnaam" value="${name}" maxlength="16" autocomplete="off"><button onclick="login()">Betreden</button></div><div class="mut">Geen app of account nodig. Alleen fictieve fiches en XP.</div><div style="color:var(--no)">${err}</div></div>`;return}
a.innerHTML=`<header><h1>${room?title():"🎰 Lobby"}</h1><span class="gold">${me.name} · niv. ${me.level} · ${me.xp} XP</span></header>${room?roomV():Z.g?czV():lobbyV()}<div id="toast">${toastT}</div>`;tick()}
const title=()=>({show:"🎤 Game Show",boss:"👹 Boss Arena",board:"🎲 Bordspel",casino:"🎲 Casino-lobby"})[room.game];
function lobbyV(){const bs=[["dealer","The Golden Dealer (niv. 1)"],["cardmaster","The Card Master (niv. 2)"],["robot","The Lucky Robot (niv. 3)"],["king","The Casino King (niv. 5)"],["mystery","The Mystery Host (niv. 7)"]];
return`<div class="card"><label><input type="checkbox" id="bots" checked> 🤖 Bots vullen lege plekken aan (ook handig om alleen te spelen)</label><br><label><input type="checkbox" id="pub" checked> 🌐 Publieke lobby (zichtbaar in de lijst; uit = privé met code)</label><div class="row">Spelers: <select id="size">${[2,3,4,5,6,7,8].map(n=>`<option ${n==6?"selected":""}>${n}</option>`).join("")}</select></div></div>
<h2>🌐 Publieke lobby's</h2><div id="pl">${plist()}</div>
<h2>👥 Casino-lobby (samen gokken)</h2><div class="card"><div class="row"><select id="cm">${Object.entries(MN).map(e=>`<option value="${e[0]}">${e[1]}</option>`).join("")}</select> Rondes per spel (afvalrace): <select id="cr">${[1,2,3,5,8,10].map(n=>`<option ${n==5?"selected":""}>${n}</option>`).join("")}</select></div><div class="row"><button onclick="send({t:'room.create',game:'casino',mode:$('#cm').value,rounds:+$('#cr').value,size:+$('#size').value,bots:$('#bots').checked,public:$('#pub').checked})">Casino-lobby maken</button></div><div class="mut">Iedereen ziet elkaars inzet en kaarten. Wie als eerste blut is, verliest.</div></div>
<h2>🎰 Casino (fiches: ${me.chips})</h2><div class="row"><button class="alt" onclick="cz('rl')">🎡 Roulette</button><button class="alt" onclick="cz('bj')">🂡 Blackjack</button><button class="alt" onclick="cz('sl')">🎰 Gokkast</button><button class="alt" onclick="cz('di')">🎲 Dobbelspel</button></div><h2>🎤 Game Show</h2><div class="row"><button onclick="go('show','quick')">⚡ Snel spelen</button><button class="alt" onclick="go('show','create')">➕ Kamer maken</button></div>
<h2>👹 Boss Arena</h2><div class="row"><select id="boss">${bs.map(b=>`<option value="${b[0]}">${b[1]}</option>`).join("")}</select></div><div class="row"><button onclick="go('boss','quick')">⚡ Snel spelen</button><button class="alt" onclick="go('boss','create')">➕ Kamer maken</button></div>
<h2>🎲 Bordspel</h2><div class="row"><button onclick="go('board','quick')">⚡ Snel spelen</button><button class="alt" onclick="go('board','create')">➕ Kamer maken</button></div>
<h2>Join met code</h2><div class="row"><input id="jc" placeholder="Code" maxlength="4" style="width:110px;text-transform:uppercase"><button class="alt" onclick="send({t:'room.join',code:$('#jc').value.toUpperCase()})">Join</button></div>`}
function go(g,w){send({t:"room."+w,game:g,boss:g=="boss"?$("#boss").value:"",size:+$("#size").value,bots:$("#bots").checked,public:$("#pub").checked})}
function link(){return location.origin+"/?room="+room.code}
function share(){const u=link();if(navigator.share)navigator.share({title:"Casino Club Online",text:"Speel mee in mijn kamer!",url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>{toastT="Link gekopieerd!";render()});else prompt("Kopieer de link:",u)}
function sb(r){const o=r.members.map((m,i)=>[m,i]).sort((a,b)=>b[0].score-a[0].score);let h="";if(r.boss&&r.boss.name)h=`<div class="mut">${r.boss.emoji} ${r.boss.name}: ${r.boss.damage} / ${r.boss.target}</div><div class="bar"><i style="width:${Math.min(100,100*r.boss.damage/Math.max(1,r.boss.target))}%"></i></div>`;
return`<div class="card">${h}<table>${o.map(([m])=>`<tr class="${m.me?"me":""}"><td>${m.n}${m.fin?" ⭐":""}${m.left?" (weg)":""}</td><td>${m.ans?"✅":""}</td><td align="right">${m.score}</td></tr>`).join("")}</table></div>`}
function roomV(){const r=room,top=`<div class="row"><button class="alt" onclick="share()">🔗 Deel link</button><button class="alt" onclick="send({t:'room.leave'})">Verlaat kamer</button></div>`;
if(r.phase=="lobby")return top+`<div class="card"><div class="mut" style="text-align:center">Kamercode</div><div class="code">${r.code}</div><div class="mut" style="text-align:center">Stuur de link: ${link()}</div></div><div class="card"><b>Spelers (${r.members.length}/${r.size})</b><table>${r.members.map(m=>`<tr><td>${m.n}${m.me?" (jij)":""}${m.n==r.hostName?" 👑":""}</td><td align="right">${m.on?"🟢":"⚪️"}</td></tr>`).join("")}</table></div>`+(r.isHost?`<div class="row"><button onclick="send({t:'room.start'})">▶️ Start het spel</button></div>${r.bots?'<div class="mut">Lege plekken worden met bots aangevuld.</div>':""}`:`<p class="mut">Wachten tot ${r.hostName} start…</p>`);
if(r.game=="casino"&&(r.phase=="cbet"||r.phase=="cplay"||r.phase=="cres"))return top+casinoV(r);
if(r.phase=="round")return top+roundV(r);
if(r.phase=="reveal"){const v=r.reveal;return top+`<div class="card"><b>Ronde ${r.roundNo}/${r.roundTotal} · uitslag</b>${v.answerText?`<p class="gold">Juiste antwoord: ${v.answerText}</p>`:""}<table>${v.results.map(x=>`<tr><td>${x.n}</td><td class="mut">${x.detail}</td><td align="right">+${x.gain}</td></tr>`).join("")}</table></div>`+sb(r)}
if(r.phase=="done"){const x=r.result;return`<div class="card"><h2>${r.game=="boss"?(x.win?"🎉 Baas verslagen!":"💀 De baas was te sterk"):"🏆 Winnaar: "+x.winner}</h2><table>${x.ranking.map((y,i)=>`<tr><td>${["🥇","🥈","🥉"][i]||"#"+(i+1)} ${y.n}</td><td align="right">${r.game=="board"?"vak "+y.score+" · 💰"+y.coins:r.game=="casino"?"🪙"+y.chips+(y.out?" (af)":""):y.score}</td></tr>`).join("")}</table></div><div class="row"><button onclick="send({t:'room.leave'})">Nieuw spel</button></div>`}
return top+boardV(r)}
function boardV(r){const b=r.board,mm=r.members,my=b.turn==r.me,p=b.pending;let act="";
if(r.phase=="roll")act=my?`<button onclick="send({t:'roll'})">🎲 Gooi de dobbelsteen!</button>`:`<span class="mut">⏳ ${mm[b.turn].n} is aan de beurt</span>`;
else if(r.phase=="mini")act=`<b>🎯 ${p.q}</b>`+(p.who==r.me?p.options.map((o,i)=>`<button class="opt alt" onclick="send({t:'pick',value:${i}})">${o}</button>`).join(""):`<div class="mut">${mm[b.turn].n} denkt na…</div>`);
else if(r.phase=="duel")act=p.who==r.me?`<b>⚔️ Kies je tegenstander</b><div class="row">${p.targets.map(t=>`<button onclick="send({t:'pick',value:${t}})">${mm[t].n}</button>`).join("")}</div>`:`<span class="mut">⚔️ ${mm[b.turn].n} kiest een tegenstander…</span>`;
return`<div class="card"><div class="gold">${b.event}</div>${b.dice?`<div style="font-size:44px">${"⚀⚁⚂⚃⚄⚅"[b.dice-1]}</div>`:""}<div class="row">${act}</div></div><div class="card">${mm.map((m,i)=>`<div class="${m.me?"me":""}">${m.n}${i==b.turn?" ◀︎":""} · vak ${m.pos}/40 · 💰${m.coins}<div class="bar"><i style="width:${100*m.pos/40}%"></i></div></div>`).join("")}</div>`}
function roundV(r){const rd=r.round,d=rd.data,k=rd.kind,mm=r.members[r.me]||{};const key=r.roundNo+k;if(L.key!=key)L={key,pick:-1,sent:0,seq:[],taps:0,early:0};
const spec=r.final&&!mm.fin,lock=spec||mm.ans||L.sent||L.pick>=0;let b="";
const opts=a=>a.map((o,i)=>`<button class="opt alt ${L.pick==i?"sel":""}" ${lock?"disabled":""} onclick="pick(${i})">${o}</button>`).join("");
if(k=="quiz")b=`<h2>${d.q}</h2>`+opts(d.options);
else if(k=="color")b=`<h2 style="font-size:46px;margin:6px;color:${COL[d.ink]}">${d.word}</h2><div class="mut">Kies de KLEUR van de letters</div>`+opts(d.options);
else if(k=="logic")b=`<h2>${d.seq.join(", ")}, ?</h2>`+opts(d.options.map(String));
else if(k=="memory")b=`<div id="mm" class="mut"></div><div class="pads">${COL.map((c,i)=>`<button class="pad" data-i="${i}" style="background:${c}" ${spec||mm.ans||L.sent?"disabled":""} onclick="padTap(${i})"></button>`).join("")}</div>`;
else if(k=="reaction")b=`<button class="big" style="background:${L.sent?"#777":rd.go?"var(--ok)":"var(--no)"}" ${lock?"disabled":""} onclick="L.sent=1;L.early=!rd.go;send({t:'ans',value:1});render()">${L.sent?(L.early?"Te vroeg! 😬":"Verstuurd ✅"):rd.go?"TIK NU!":"Wacht…"}</button>`;
else if(k=="number")b=`<h2>Raad het getal (1-100)</h2><div class="code" id="gv">${L.g||50}</div><input type="range" min="1" max="100" value="${L.g||50}" style="width:100%" ${lock?"disabled":""} oninput="L.g=+this.value;$('#gv').textContent=this.value"><div class="row"><button ${lock?"disabled":""} onclick="L.sent=1;send({t:'ans',value:L.g||50});render()">Gok versturen</button></div>`;
else if(k=="arcade")b=`<h2>⭐ Tik zoveel mogelijk! Score: <span id="tp">${L.taps}</span></h2><button class="big" style="background:var(--btn);color:var(--btnink)" ${spec?"disabled":""} onclick="L.taps++;$('#tp').textContent=L.taps;send({t:'ans',value:L.taps})">⭐</button>`;
return`<div class="card"><div class="row" style="justify-content:space-between"><b>Ronde ${r.roundNo}/${r.roundTotal}${r.final?" · 🔥 FINALE x2":""}</b><b id="cd"></b></div>${spec?'<div class="mut">👀 Alleen finalisten spelen deze ronde.</div>':""}${b}${lock&&!spec&&k!="memory"&&k!="arcade"?'<p class="mut">✅ Verstuurd. Wachten op de anderen…</p>':""}</div>`+sb(r)}
function pick(i){if(L.pick>=0)return;L.pick=i;send({t:"ans",value:i});render()}
function padTap(i){L.seq.push(i);if(L.seq.length==room.round.data.seq.length){L.sent=1;send({t:"ans",value:L.seq});render()}}

/* ---- casino online: fiches in je account, kansen op de server ---- */
const Z={g:"",bet:25,pick:"seven"},SY=["🍒","🍋","🍊","🍇","🔔","⭐","💎","7️⃣"],RD=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
function cz(g){Z.g=g;Z.res=Z.bj=null;if(g=="rl")send({t:"cz.rl.join"});render()}
function czBack(){if(Z.g=="rl")send({t:"cz.rl.leave"});Z.g="";render()}
const bb=()=>`<div class="row">${[5,25,100,500].map(v=>`<button class="${v==Z.bet?"":"alt"}" onclick="Z.bet=${v};render()">${v}</button>`).join("")}${me.chips<5?'<button onclick="send({t:\'cz.free\'})">🎁 +500</button>':""}</div>`;
const cd=c=>`<span style="display:inline-block;min-width:44px;margin:3px;padding:7px 4px;border-radius:8px;background:#fff;color:${c[1]==1||c[1]==2?"#c0392b":"#111"};font-weight:700">${({11:"J",12:"Q",13:"K",14:"A"})[c[0]]||c[0]}${"♠♥♦♣"[c[1]]}</span>`;
const bt=h=>{let t=0,a=0;h.forEach(c=>{if(c[0]==14){a++;t+=11}else t+=Math.min(c[0],10)});while(t>21&&a){t-=10;a--}return t};
function czV(){const g=Z.g,r=Z.res,top=`<div class="row"><button class="alt" onclick="czBack()">← Lobby</button><span class="gold">🪙 ${me.chips}</span></div>`;let b="";
if(g=="sl"){const x=r&&r.game=="slots"?r:null;b=`<div class="card" style="text-align:center;font-size:52px">${x?x.reels.map(i=>SY[i]).join(" "):"🎰 🎰 🎰"}</div><p class="gold" style="text-align:center">${x?(x.win?"Gewonnen: "+x.win+"! 🎉":"Helaas, geen winst."):"Draai aan de gokkast!"}</p>${bb()}<div class="row"><button onclick="send({t:'cz.slots',bet:Z.bet})">DRAAI (${Z.bet})</button></div><p class="mut">3 gelijk: 🍒5x 🍋8x 🍊10x 🍇15x 🔔25x ⭐50x 💎100x 7️⃣250x · 🍒🍒 2x · 🍒 0,5x</p>`}
else if(g=="di"){const x=r&&r.game=="dice"?r:null;b=`<div class="card" style="text-align:center;font-size:64px">${x?"⚀⚁⚂⚃⚄⚅"[x.a-1]+"⚀⚁⚂⚃⚄⚅"[x.b-1]:"🎲🎲"}</div><p class="gold" style="text-align:center">${x?"Som "+(x.a+x.b)+": "+(x.win?"je wint "+(x.win-x.bet)+"! 🎉":"helaas, verloren."):"Kies en gooi!"}</p><div class="row">${[["under","Onder 7 (1x)"],["seven","Zeven (4x)"],["over","Over 7 (1x)"]].map(p=>`<button class="${Z.pick==p[0]?"":"alt"}" onclick="Z.pick='${p[0]}';render()">${p[1]}</button>`).join("")}</div>${bb()}<div class="row"><button onclick="send({t:'cz.dice',bet:Z.bet,pick:Z.pick})">GOOI (${Z.bet})</button></div>`}
else if(g=="bj"){const x=Z.bj,pl=x&&x.st=="play";b=x?`<div class="card"><div>Deler ${pl?bt([x.d[0]]):bt(x.d)}</div>${x.d.map((c,i)=>pl&&i==1?"🂠":cd(c)).join("")}<p class="gold">${x.msg}</p><div>Jij ${bt(x.p)}</div>${x.p.map(cd).join("")}</div>`:`<p class="mut">Kies je inzet en deel.</p>`;
b+=pl?`<div class="row"><button onclick="send({t:'cz.bj.hit'})">Kaart</button><button class="alt" onclick="send({t:'cz.bj.stand'})">Blijven</button><button class="alt" onclick="send({t:'cz.bj.double'})">Verdubbelen</button></div>`:bb()+`<div class="row"><button onclick="send({t:'cz.bj.deal',bet:Z.bet})">${x?"Nieuwe ronde":"Delen"} (${Z.bet})</button></div>`}
else{const x=Z.rl;if(!x)return top+"<p>Verbinden met de tafel…</p>";const mb=x.myBets,tot=Object.values(mb).reduce((p,q)=>p+q,0),res=x.result;
b=`<div class="card" style="text-align:center"><div class="mut">${x.phase=="bet"?"Inzetten kan nog":x.phase=="spin"?"De bal rolt…":"Uitslag"} · <b id="cd2"></b> · 👥 ${x.players}</div><div class="code">${x.phase=="bet"||(x.phase=="spin"&&false)?"?":(x.phase=="spin"?"…":res)}</div><div class="gold">${x.phase=="result"?"Uitgekomen: "+res+" ("+(res?RD.has(res)?"rood":"zwart":"groen")+"). "+(x.myWin?"Je wint "+x.myWin+"! 🎉":tot?"Helaas.":""):""}</div><div class="mut">Laatste: ${x.last.join(", ")}</div></div>${bb()}<div class="row">${[["red","Rood"],["black","Zwart"],["even","Even"],["odd","Oneven"],["low","1-18"],["high","19-36"],["d1","1e 12"],["d2","2e 12"],["d3","3e 12"]].map(k=>`<button class="alt" onclick="send({t:'cz.rl.bet',key:'${k[0]}',amt:Z.bet})">${k[1]}${mb[k[0]]?" ("+mb[k[0]]+")":""}</button>`).join("")}</div><div class="row"><select id="rn">${[...Array(37).keys()].map(i=>`<option>${i}</option>`).join("")}</select><button class="alt" onclick="send({t:'cz.rl.bet',key:'n'+$('#rn').value,amt:Z.bet})">Zet in op getal (36x)</button><button class="alt" onclick="send({t:'cz.rl.clear'})">Wis inzet</button></div><p class="mut">Je inzet: ${Object.entries(mb).map(e=>e[0]+" "+e[1]).join(" · ")||"geen"}</p>`}
return top+b}

const MN={roulette:"🎡 Roulette",blackjack:"🂡 Blackjack",slots:"🎰 Gokkast",dice:"🎲 Dobbelspel",poker:"♠️ Poker",race:"🏁 Afvalrace"};let Pub=[],CB={chip:25,num:7};

return`<div class="card" style="${cs.turn==i&&ph=="cplay"?"outline:3px solid var(--gold)":""}">${d}</div>`}).join("");
if(me.out)return t+'<p class="mut">💀 Je bent afgevallen. Je kijkt mee.</p>';

else{if(g=="dice")t+=`<div class="row">${[["under","Onder 7"],["seven","Zeven (4x)"],["over","Over 7"]].map(p=>`<button class="${me.pick==p[0]?"":"alt"}" onclick="send({t:'c.bet',amt:Math.max(${me.bet||0},CB.chip),pick:'${p[0]}'})">${p[1]}</button>`).join("")}</div>`;t+=`<div class="row"><button class="alt" onclick="send({t:'c.bet',amt:CB.chip,pick:'${me.pick||""}'})">Inzet: ${CB.chip}</button></div>`}

return t}
